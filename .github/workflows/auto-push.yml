name: Automatic Code Push

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create File
        run: |
          echo "Code pushed automatically using GitHub Action" > output.txt

      - name: Push Changes
        run: |
          git add output.txt
          git commit -m "Automated code push"
          git push